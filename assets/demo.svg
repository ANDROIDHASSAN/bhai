<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-label="Terminal: /bhai on a repo link. It measures the repo, reproduces a bug with a failing test, makes a 3-line fix, runs the repo's checks, reviews itself, and explains the change in Hinglish.">
